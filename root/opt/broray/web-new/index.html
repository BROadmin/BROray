<!doctype html>
<html lang="ru" data-build-id="20260725-webui-desktop-layout-11">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#0b1117">
    <meta name="robots" content="noindex,nofollow">
    <title>BROray — Вход</title>
    <link rel="icon" href="/assets/images/branding/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/branding/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/branding/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/branding/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json?v=20260725-webui-desktop-layout-11">
    <link rel="stylesheet" href="/assets/css/allpage.css?v=20260725-webui-desktop-layout-11">
    <script src="/assets/js/theme-init.js?v=20260725-webui-desktop-layout-11"></script>
</head>
<body class="login-body page-login" data-webui-build="20260725-webui-desktop-layout-11">
<main class="login-page">
 <section aria-labelledby="login-title" class="login-card">
  <div class="brand">
   <div aria-hidden="true" class="brand-mark">
    <span class="brand-ray">
    </span>
    <span class="brand-core">
     B
    </span>
   </div>
   <div>
    <div class="brand-name">
     BROray
    </div>
    <div class="brand-subtitle">
     Xray для Keenetic
    </div>
   </div>
  </div>
  <div class="login-copy">
   <h1 id="login-title">
    Вход
   </h1>
   <p>
    Используйте логин и пароль от интерфейса Keenetic.
   </p>
  </div>
  <form class="login-form" id="login-form" novalidate="">
   <label class="field">
    <span class="field-label">
     Логин
    </span>
    <input autocapitalize="none" autocomplete="username" id="login" maxlength="128" name="login" required="" spellcheck="false" type="text"/>
   </label>
   <label class="field">
    <span class="field-label">
     Пароль
    </span>
    <span class="password-control">
     <input autocomplete="current-password" id="password" maxlength="512" name="password" required="" type="password"/>
     <button aria-label="Показать пароль" class="password-toggle" data-icon="visibility" id="password-toggle" title="Показать пароль" type="button">
     </button>
    </span>
   </label>
   <div class="form-message form-message-error" hidden="" id="login-error" role="alert">
   </div>
   <button class="button button-primary" id="login-submit" type="submit">
    <span class="button-label">
     Войти
    </span>
    <span aria-hidden="true" class="button-spinner">
    </span>
   </button>
  </form>
  <p class="login-security">
   BROray не сохраняет пароль. Данные проверяются KeeneticOS.
  </p>
 </section>
 <footer class="support">
  <span>
   Поддержать развитие BROray
  </span>
  <a href="https://pay.cloudtips.ru/p/09b23d0a" rel="noopener noreferrer" target="_blank">
   Поддержать проект
  </a>
</footer>
</main>
    <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>
    <script src="/assets/js/common.js?v=20260725-webui-desktop-layout-11"></script>
    <script src="/assets/js/icons.js?v=20260725-webui-desktop-layout-11"></script>
    <script src="/assets/js/login.js?v=20260725-webui-desktop-layout-11"></script>
    <script src="/assets/js/theme.js?v=20260725-webui-desktop-layout-11"></script>
</body>
</html>
