<main class="login-page">
 <section aria-labelledby="login-title" class="login-card">
  <div class="brand">
   <div aria-hidden="true" class="brand-mark">
    <span class="brand-ray">
    </span>
    <span class="brand-core">
     B
    </span>
   </div>
   <div>
    <div class="brand-name">
     BROray
    </div>
    <div class="brand-subtitle">
     Xray для Keenetic
    </div>
   </div>
  </div>
  <div class="login-copy">
   <h1 id="login-title">
    Вход
   </h1>
   <p>
    Используйте логин и пароль от интерфейса Keenetic.
   </p>
  </div>
  <form class="login-form" id="login-form" novalidate="">
   <label class="field">
    <span class="field-label">
     Логин
    </span>
    <input autocapitalize="none" autocomplete="username" id="login" maxlength="128" name="login" required="" spellcheck="false" type="text"/>
   </label>
   <label class="field">
    <span class="field-label">
     Пароль
    </span>
    <span class="password-control">
     <input autocomplete="current-password" id="password" maxlength="512" name="password" required="" type="password"/>
     <button aria-label="Показать пароль" class="password-toggle" data-icon="visibility" id="password-toggle" title="Показать пароль" type="button">
     </button>
    </span>
   </label>
   <div class="form-message form-message-error" hidden="" id="login-error" role="alert">
   </div>
   <button class="button button-primary" id="login-submit" type="submit">
    <span class="button-label">
     Войти
    </span>
    <span aria-hidden="true" class="button-spinner">
    </span>
   </button>
  </form>
  <p class="login-security">
   BROray не сохраняет пароль. Данные проверяются KeeneticOS.
  </p>
 </section>
 <footer class="support">
  <span>
   Поддержать развитие BROray
  </span>
  <a href="https://pay.cloudtips.ru/p/09b23d0a" rel="noopener noreferrer" target="_blank">
   Поддержать проект
  </a>
</footer>
</main>
