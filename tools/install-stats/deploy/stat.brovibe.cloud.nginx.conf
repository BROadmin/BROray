server {
    listen 443 ssl;
    server_name stat.brovibe.cloud;

    ssl_certificate /etc/letsencrypt/live/stat.brovibe.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stat.brovibe.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log off;
    error_log /dev/null;

    if ($host != stat.brovibe.cloud) {
        return 421;
    }

    location = /v1/install-events {
        client_max_body_size 1k;
        client_body_buffer_size 1k;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_connect_timeout 2s;
        proxy_send_timeout 4s;
        proxy_read_timeout 6s;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Host stat.brovibe.cloud;
        proxy_set_header Content-Type $content_type;
        proxy_pass http://127.0.0.1:8091;
    }

    location / {
        return 404;
    }
}
