name: Apply BROray 2.1.1 release overlay

on:
  push:
    branches:
      - agent/release-broray-2.1.1
    paths:
      - '.github/workflows/apply-broray-2.1.1.yml'
      - '.release/**'

permissions:
  contents: write

env:
  OVERLAY_SHA256: 59634b3d309fc093ec5b5e6d0e2396fad9dbcc6943156118e5908a830281c724

jobs:
  apply-verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y busybox jq ripgrep unzip

      - name: Reassemble and verify overlay
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .release/overlay.part000 \
            .release/overlay.part001 \
            .release/overlay.part002 \
            .release/overlay.part003 \
            .release/overlay.part004 \
            .release/overlay.part0050 \
            .release/overlay.part0051 \
            .release/overlay.part0052 \
            .release/overlay.part0053 \
            .release/overlay.part0060 \
            .release/overlay.part0061 \
            .release/overlay.part0062 \
            .release/overlay.part0063 \
            .release/overlay.part007 \
            > /tmp/broray211-overlay.b64
          base64 --decode /tmp/broray211-overlay.b64 > /tmp/broray211-overlay.tar.gz
          echo "$OVERLAY_SHA256  /tmp/broray211-overlay.tar.gz" | sha256sum -c -
          tar -tzf /tmp/broray211-overlay.tar.gz >/dev/null

      - name: Apply clean source overlay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/broray211-overlay
          tar -xzf /tmp/broray211-overlay.tar.gz -C /tmp/broray211-overlay
          cp -a /tmp/broray211-overlay/. .
          python3 .release/apply-release.py

          cp root/opt/broray/web-new/build.json /tmp/broray-build.json
          rm -rf /tmp/broray-web-new
          BRORAY_ROOT="$PWD/root/opt/broray" \
          BRORAY_WEB_SRC="$PWD/root/opt/broray/web-src" \
          BRORAY_WEB_OUT=/tmp/broray-web-new \
            busybox ash root/opt/broray/web-src/build-web.sh
          rm -rf root/opt/broray/web-new
          mv /tmp/broray-web-new root/opt/broray/web-new
          cp /tmp/broray-build.json root/opt/broray/web-new/build.json

          chmod 755 \
            scripts/build-opkg-release-2.1.1.sh \
            scripts/safe-opkg-upgrade-2.1.1.sh \
            scripts/verify-release-2.1.1.sh

      - name: Verify and build BROray 2.1.1
        shell: bash
        run: |
          set -euo pipefail
          scripts/verify-release-2.1.1.sh

      - name: Upload verified OPKG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BROray-2.1.1-verified-release
          path: |
            dist/BROray-opkg-update-2.1.1-1.tar.gz
            dist/SHA256SUMS
            dist/broray-safe-upgrade-2.1.1-1.sh
            dist/opkg.sh
            dist/opkg/aarch64-3.10/Packages
            dist/opkg/aarch64-3.10/Packages.gz
            dist/opkg/aarch64-3.10/broray_2.1.1-1_aarch64-3.10.ipk
          if-no-files-found: error
          retention-days: 30

      - name: Commit verified source changes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release
          rm -f .github/workflows/apply-broray-2.1.1.yml
          git config user.name 'BROray Release Bot'
          git config user.email '307129396+BROadmin@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 1
          fi
          git commit -m 'Release BROray 2.1.1'
          git push origin HEAD:agent/release-broray-2.1.1
