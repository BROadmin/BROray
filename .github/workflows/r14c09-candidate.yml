name: Build BROray 3.0.0-r14c09 candidate

on:
  push:
    branches:
      - automation/r14c09-build-20260816
    paths:
      - 'tools/r14c09/**'
      - '.github/workflows/r14c09-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4

      - name: Install target-shell test tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends busybox jq

      - name: Restore exact build tools
        shell: bash
        run: |
          set -Eeuo pipefail
          cat tools/r14c09/builder-v3.part-* > /tmp/build_candidate.py.gz.b64
          [ "$(wc -c </tmp/build_candidate.py.gz.b64 | tr -d ' ')" = 15300 ]
          [ "$(sha256sum /tmp/build_candidate.py.gz.b64 | awk 'NR==1{print $1;exit}')" = 34cd36d5b2e6ec3fd7f17c088dcac63dfc0b056aa18821f2987023f6008e8aca ]
          base64 -d /tmp/build_candidate.py.gz.b64 | gzip -d > tools/r14c09/build_candidate.py
          [ "$(sha256sum tools/r14c09/build_candidate.py | awk 'NR==1{print $1;exit}')" = f930f95b0730e68ace57310582c2b52b9dc2c89f59ab795beaec24d48d2e9b8b ]
          base64 -d tools/r14c09/ci-build.sh.gz.b64 | gzip -d > tools/r14c09/ci-build.sh
          chmod 0700 tools/r14c09/ci-build.sh tools/r14c09/build_candidate.py
          python3 -m py_compile tools/r14c09/build_candidate.py
          bash -n tools/r14c09/ci-build.sh

      - name: Build and validate r14c09
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tools/r14c09/ci-build.sh

      - name: Upload exact deliverables
        uses: actions/upload-artifact@v4
        with:
          name: BROray-3.0.0-r14c09-deliverables
          path: dist/r14c09/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
