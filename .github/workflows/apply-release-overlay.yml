name: Apply BROray 2.1.1-2 release overlay

on:
  push:
    branches:
      - release/2.1.1-2-official
    paths:
      - .release-overlay/READY

permissions:
  contents: write

jobs:
  apply-overlay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify official source overlay
        shell: bash
        run: |
          set -euo pipefail
          curl -fL \
            -H 'Accept-Encoding: identity' \
            -H 'Cache-Control: no-cache, no-store' \
            --connect-timeout 20 \
            --max-time 300 \
            -o /tmp/broray-overlay.tar.gz \
            'https://api.brovibe.cloud/releases/2.1.1-2/github-source-overlay-2.1.1-2.tar.gz?v=20260727-official'
          echo "2051fac16bdb959613a537d1e3af46234396478219c31bb26f455451aee1cf26  /tmp/broray-overlay.tar.gz" | sha256sum -c -
          python3 - <<'PY'
          import tarfile
          from pathlib import PurePosixPath
          archive = '/tmp/broray-overlay.tar.gz'
          with tarfile.open(archive, 'r:gz') as tar:
              for member in tar.getmembers():
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe path: {member.name}')
                  if member.issym() or member.islnk():
                      raise SystemExit(f'link is not allowed: {member.name}')
          PY

      - name: Apply verified source overlay
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/broray-overlay.tar.gz -C .
          grep -Fq 'https://t.me/BROvibe_vpn' README.md
          grep -Fq 'OPKG `2.1.1-2`' README.md
          grep -Fq '2.1.1-2 — 2026-07-27' CHANGELOG.md
          grep -Fq 'TARGET_VERSION="2.1.1-2"' scripts/safe-opkg-upgrade-2.1.1-2.sh
          grep -Fq 'TARGET_VERSION="2.1.1-2"' scripts/install-opkg-release-2.1.1-2.sh
          rm -rf .release-overlay
          rm -f .github/workflows/apply-release-overlay.yml

      - name: Commit official release source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BROray Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Release BROray 2.1.1-2 source overlay'
          git push origin HEAD:release/2.1.1-2-official
